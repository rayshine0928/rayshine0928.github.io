<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We're Getting Married — 2026.09.28</title>
    <meta name="description" content="我们结婚了！2026年9月28日，杭州西湖 · 六通宾馆。期待您的见证与祝福。">
    <meta property="og:title" content="我们的婚礼 — 2026.09.28">
    <meta property="og:description" content="诚挚邀请您参加我们的婚礼，杭州西湖 · 六通宾馆">
    <meta property="og:url" content="https://0928.love">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preload" as="image" href="{{ '/img/couple_portrait.webp' | relative_url }}" fetchpriority="high">
    <link rel="stylesheet" href="{{ '/css/wedding.css' | relative_url }}">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
    <!-- 固定婚纱照背景 — 铺满全页、不随内容滚动 -->
    <div class="site-bg" aria-hidden="true"></div>

    <!-- 明亮水彩极光场 — 五团暖色光斑在照片与内容之间缓慢漂移，
         被玻璃卡 backdrop-filter 折射 = 极光透过玻璃 -->
    <div class="aurora-field" aria-hidden="true">
        <div class="aurora-blob aurora-1"></div>
        <div class="aurora-blob aurora-2"></div>
        <div class="aurora-blob aurora-3"></div>
        <div class="aurora-blob aurora-4"></div>
        <div class="aurora-blob aurora-5"></div>
    </div>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="#hero" class="nav-logo">0928</a>
            <ul class="nav-links">
                <li><a href="#invitation">请柬</a></li>
                <li><a href="#moment">瞬间</a></li>
                <li><a href="#venue">场地</a></li>
                <li><a href="#schedule">流程</a></li>
                <li><a href="#rsvp">回执</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    {{ content }}

    <!-- v26 特效层：fx-core（共享 ticker/指针内核）→ wedding-fx（极光视差/
         光标胶囊/金尘粒子/卡片追光/磁性按钮/导航滑囊/题词/圆形揭示）→
         wedding（倒计时/视差/reveal/导航） -->
    <script src="{{ '/js/fx-core.js' | relative_url }}"></script>
    <script src="{{ '/js/wedding-fx.js' | relative_url }}"></script>
    <script src="{{ '/js/wedding.js' | relative_url }}"></script>
</body>
</html>
